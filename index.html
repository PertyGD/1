<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="calculator">
      <input type="text" id="result" placeholder="0" readonly>
      <div class="button-grid">
        <button class="clear" data-action="clear">C</button>
        <button class="operator" data-action="operator">/</button>
        <button class="operator" data-action="operator">*</button>
        <button class="operator" data-action="operator">-</button>
        <button class="number" data-action="number">7</button>
        <button class="number" data-action="number">8</button>
        <button class="number" data-action="number">9</button>
        <button class="operator" data-action="operator">+</button>
        <button class="number" data-action="number">4</button>
        <button class="number" data-action="number">5</button>
        <button class="number" data-action="number">6</button>
        <button class="equals" data-action="calculate">=</button>
        <button class="number" data-action="number">1</button>
        <button class="number" data-action="number">2</button>
        <button class="number" data-action="number">3</button>
        <button class="number zero" data-action="number">0</button>
        <button class="decimal" data-action="decimal">.</button>
      </div>
    </div>
  </div>
  <script src="index.js"></script>
</body>

</html>
